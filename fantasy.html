<!DOCTYPE html>
<html lang="en">

<head>
  <title>Fantasy Waiver Wire - Winston Riggs</title>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Sleeper fantasy football waiver wire analyzer. Ranks free agents by blending projections with snap-share-weighted production.">
  <meta name="author" content="Winston Riggs">

  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

  <style>
    /* page-local tokens: --success/--danger in styles.css are self-referential */
    /* styles.css sets box-sizing on a few selectors only, never globally, so a
       100%-width input adds its padding and border on top and overflows. */
    .ff,
    .ff *,
    .ff *::before,
    .ff *::after {
      box-sizing: border-box;
    }

    .ff {
      --ok: #5fd0a0;
      --warn: var(--accent);
      --bad: #ff6b6b;
    }

    .ff {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    .ff h1 {
      font-size: 26px;
      margin: 0 0 6px;
      color: var(--text-1);
    }

    .ff h2 {
      font-size: 17px;
      margin: 32px 0 12px;
      color: var(--brand);
    }

    .ff h2 .sub {
      font-weight: 400;
      color: var(--text-2);
      font-size: 13px;
      margin-left: 8px;
    }

    .ff .lede {
      color: var(--text-2);
      margin: 0 0 24px;
      font-size: 14px;
    }

    .ff .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }

    .ff label {
      display: block;
      font-size: 13px;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .ff input {
      width: 100%;
      padding: 11px 13px;
      font: inherit;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-1);
    }

    .ff input:focus {
      outline: 2px solid var(--brand);
      outline-offset: -1px;
    }

    .ff button {
      font: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-1);
      padding: 11px 18px;
    }

    .ff button.primary {
      background: var(--brand-deep);
      border-color: var(--brand-deep);
      color: var(--bg);
      font-weight: 700;
    }

    .ff button:disabled {
      opacity: .5;
      cursor: default;
    }

    .ff .row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .ff .row>div {
      flex: 1 1 220px;
      min-width: 0;
    }

    @media (max-width: 576px) {
      .ff { padding: 20px 12px 64px; }
      .ff .row>div { flex-basis: 100%; }
      .ff .row>button { width: 100%; }
      .ff h1 { font-size: 22px; }
    }

    .ff .leagues {
      display: grid;
      gap: 10px;
      margin-top: 6px;
    }

    .ff .league {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      text-align: left;
      width: 100%;
      padding: 14px 16px;
    }

    .ff .league:hover {
      border-color: var(--brand);
    }

    .ff .league .nm {
      font-weight: 700;
      color: var(--text-1);
    }

    .ff .league .meta {
      font-size: 12.5px;
      color: var(--text-2);
      margin-top: 2px;
    }

    .ff .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
      white-space: nowrap;
    }

    .ff .scroll {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }

    .ff table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .ff th {
      text-align: left;
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-2);
      font-weight: 700;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .ff td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .ff tr:last-child td {
      border-bottom: 0;
    }

    .ff tbody tr:hover {
      background: var(--surface-2);
    }

    .ff .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .ff .pos {
      display: inline-block;
      min-width: 34px;
      text-align: center;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 0;
      border-radius: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
    }

    .ff .pos.QB {
      color: #ff8fa3;
    }

    .ff .pos.RB {
      color: var(--ok);
    }

    .ff .pos.WR {
      color: var(--brand);
    }

    .ff .pos.TE {
      color: var(--accent);
    }

    .ff .pos.DEF {
      color: #b39ddb;
    }

    .ff .nm {
      font-weight: 700;
    }

    .ff .good {
      color: var(--ok);
    }

    .ff .warn {
      color: var(--warn);
    }

    .ff .bad {
      color: var(--bad);
    }

    .ff .dim {
      color: var(--text-2);
    }

    .ff .tag {
      font-size: 10.5px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-left: 6px;
      border: 1px solid currentColor;
      background: none;
      opacity: .85;
    }

    .ff .hint {
      font-size: 12.5px;
      color: var(--text-2);
      margin: 8px 0 0;
    }

    .ff .err {
      color: var(--bad);
      font-size: 13.5px;
      margin-top: 10px;
    }

    .ff .back {
      background: none;
      border: 0;
      color: var(--brand);
      padding: 0;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .ff .hidden {
      display: none;
    }

    .ff .bar {
      height: 5px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 14px;
    }

    .ff .bar>div {
      height: 100%;
      background: var(--brand);
      width: 0;
      transition: width .25s;
    }

    .ff .pill {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      font-size: 12.5px;
      color: var(--text-2);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 12px;
      margin: 0 6px 6px 0;
    }

    .ff .note {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      padding: 12px 16px;
      font-size: 13.5px;
      color: var(--text-2);
      margin-top: 12px;
    }

    .ff .note b {
      color: var(--text-1);
    }

    .ff .tradecols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .ff select {
      width: 100%;
      padding: 9px 11px;
      font: inherit;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-1);
      margin-bottom: 8px;
    }

    /* grid items default to min-width:auto, so a long player row would stop the
       column shrinking and push the card past the viewport on a phone */
    .ff .tradecols>div {
      min-width: 0;
    }

    .ff .picklist {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      padding: 4px;
    }

    .ff .pick {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      text-align: left;
      padding: 7px 9px;
      margin: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      background: none;
      font-size: 13px;
    }

    .ff .pick {
      overflow: hidden;
      white-space: nowrap;
      min-width: 0;
    }

    .ff .pick>.num {
      margin-left: auto;
      flex: none;
    }

    .ff .pick:hover {
      border-color: var(--border);
    }

    .ff .pick.on {
      background: rgba(33, 158, 188, 0.18);
      border-color: var(--brand-deep);
    }

    @media (max-width: 576px) {
      .ff .tradecols { grid-template-columns: 1fr; }
    }

    /* ---------- charts ----------------------------------------------------
       Marks are HTML, not SVG: a viewBox would scale label text down to ~5px
       on a 320px phone. Colours validated against the card surface #161d24 --
       diverging blue/red passes all six checks; the dumbbell pair is one hue,
       two ordinal steps (L* 0.622 -> 0.764), both above 3:1. ------------- */
    .ff {
      --c-mark: #3987e5;
      /* blue 400  4.67:1 */
      --c-mark-2: #86b6ef;
      /* blue 250  8.06:1 */
      --c-neg: #e66767;
      /* red       5.26:1 */
      --c-mute: #6b7c8a;
      /* de-emphasis 3.95:1 */
      --c-grid: #29363f;
    }

    .ff .chart {
      margin: 14px 0 6px;
    }

    .ff .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 12px;
    }

    .ff .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .ff .key {
      width: 10px;
      height: 10px;
      border-radius: 99px;
      flex: none;
    }

    .ff .key.rect {
      width: 12px;
      height: 10px;
      border-radius: 2px;
    }

    /* --- horizontal bars (roster) --- */
    /* widest roster name measures 137px, so the column has to clear that or
       most rows ellipsize; the plot is capped so 16 short values don't stretch
       into 900px bars on a wide screen */
    .ff .plot {
      max-width: 660px;
    }

    .ff .brow {
      display: grid;
      grid-template-columns: minmax(0, 122px) 1fr;
      align-items: center;
      gap: 10px;
      padding: 3px 0;
    }

    .ff .bname {
      font-size: 12px;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ff .callout {
      font-size: 12px;
      color: var(--text-2);
      margin: 0 0 10px;
    }

    .ff .callout b {
      color: var(--text-1);
      font-weight: 700;
    }

    @media (max-width: 576px) {
      .ff .brow { grid-template-columns: minmax(0, 104px) 1fr; }
      .ff .dbrow { grid-template-columns: minmax(0, 48px) 1fr; }
    }

    .ff .btrack {
      height: 14px;
      position: relative;
    }

    /* NOT .bar -- that class is the loading progress bar further up this sheet,
       and its margin-top pushed every chart mark a full row out of line. */
    .ff .vbar {
      position: absolute;
      inset: 0 auto 0 0;
      height: 14px;
      /* 4px rounded data-end, square at the baseline */
      border-radius: 0 4px 4px 0;
      background: var(--c-mute);
    }

    .ff .vbar.on {
      background: var(--c-mark);
    }

    .ff .bval {
      font-size: 12px;
      text-align: right;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
    }

    /* --- dumbbell (scored vs best possible) --- */
    .ff .dbrow {
      display: grid;
      grid-template-columns: minmax(0, 58px) 1fr;
      align-items: center;
      gap: 8px;
      padding: 7px 0;
    }

    .ff .dbtrack {
      position: relative;
      height: 16px;
    }

    .ff .dbline {
      position: absolute;
      top: 7px;
      height: 2px;
      border-radius: 2px;
      background: var(--c-mute);
    }

    .ff .dbdot {
      position: absolute;
      top: 3px;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 99px;
      /* 2px surface ring keeps overlapping dots legible */
      box-shadow: 0 0 0 2px var(--surface);
    }

    .ff .dbdot.a {
      background: var(--c-mark);
    }

    .ff .dbdot.b {
      background: var(--c-mark-2);
    }

    /* the mark is small; the hit target must not be */
    .ff .dbdot::after,
    .ff .vbar::after,
    .ff .dvbar::after {
      content: '';
      position: absolute;
      top: 50%;
      height: 24px;
      transform: translateY(-50%);
    }

    .ff .dbdot::after {
      left: 50%;
      width: 24px;
      margin-left: -12px;
    }

    .ff .vbar::after,
    .ff .dvbar::after {
      left: 0;
      right: 0;
    }

    .ff .dblab {
      position: absolute;
      top: -1px;
      font-size: 11px;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* --- diverging bars (trade deltas) --- */
    .ff .dvrow {
      display: grid;
      grid-template-columns: minmax(0, 58px) 1fr 52px;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .ff .dvtrack {
      position: relative;
      height: 14px;
    }

    .ff .dvzero {
      position: absolute;
      left: 50%;
      top: -2px;
      bottom: -2px;
      width: 1px;
      background: var(--c-grid);
    }

    .ff .dvbar {
      position: absolute;
      top: 0;
      height: 14px;
      background: var(--c-mark);
    }

    .ff .dvbar.pos {
      border-radius: 0 4px 4px 0;
    }

    .ff .dvbar.neg {
      border-radius: 4px 0 0 4px;
      background: var(--c-neg);
    }

    .ff .axis {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-2);
      border-top: 1px solid var(--c-grid);
      padding-top: 4px;
      margin-top: 6px;
    }

    .ff .tip {
      position: fixed;
      z-index: 200;
      pointer-events: none;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 12px;
      color: var(--text-2);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
      max-width: 240px;
    }

    .ff .tip b {
      color: var(--text-1);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .ff [data-tip]:hover,
    .ff [data-tip]:focus-visible {
      filter: brightness(1.18);
      outline: none;
    }

    .ff .tstats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .ff .tstat {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    .ff .tstat .k {
      display: block;
      font-size: 10.5px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text-2);
    }

    .ff .tstat .v {
      display: block;
      font-size: 18px;
      margin-top: 2px;
    }

    .ff .tverdict {
      margin: 10px 0 0;
      font-size: 14px;
    }

    .ff .note--plain {
      border-left-color: var(--border);
      margin-top: 28px;
    }

    .ff .sparks {
      font-variant-numeric: tabular-nums;
      color: var(--text-2);
      font-size: 12.5px;
    }
  </style>
</head>

<body>
  <canvas id="particles-bg" aria-hidden="true"></canvas>

  <header>
    <div class="header">
      <div class="logo">
        <a href="index.html">
          <span class="logo_text">> 01010111 01010010</span>
          <span class="logo_cursor"></span>
        </a>
      </div>
      <input class="nav-toggle" type="checkbox" id="nav-toggle">
      <label class="nav-burger" for="nav-toggle" aria-label="Menu"></label>
      <div class="navbar">
        <a href="codeography.html">Codeography</a>
        <a href="legal.html">Legal</a>
      </div>
    </div>
  </header>

  <main>
    <div class="ff">

      <!-- ========== STEP 1: USERNAME ========== -->
      <section id="s-user">
        <h1>Sleeper Waiver Wire</h1>
        <p class="lede">Find the best available pickups for your league.</p>
        <div class="card">
          <div class="row">
            <div>
              <label for="uname">Sleeper username</label>
              <input id="uname" autocomplete="off" spellcheck="false">
            </div>
            <button class="primary" id="go">Find leagues</button>
          </div>
          <p class="hint">Your Sleeper display name — not your email.</p>
          <div class="err hidden" id="uerr"></div>
        </div>
      </section>

      <!-- ========== STEP 2: LEAGUE PICKER ========== -->
      <section id="s-league" class="hidden">
        <button class="back" id="back1">&larr; Change user</button>
        <h1 id="uwelcome"></h1>
        <p class="lede">Pick a league to analyze.</p>
        <div class="leagues" id="lgs"></div>
      </section>

      <!-- ========== STEP 3: REPORT ========== -->
      <section id="s-report" class="hidden">
        <button class="back" id="back2">&larr; Change league</button>

      </section>

      <!-- ========== LOADING ========== -->
      <section id="s-load" class="hidden">
        <div class="card">
          <div id="lmsg">Loading…</div>
          <div class="bar">
            <div id="lbar"></div>
          </div>
          <p class="hint" id="lhint"></p>
        </div>

    </div>

  <script src="scripts/particles.js" defer></script>
  <script>

    const API = 'https://api.sleeper.app/v1';
let TRADE = null;   // set by buildReport; drives the trade evaluator
    const $ = id => document.getElementById(id);
    const show = id => ['s-user', 's-league', 's-report', 's-load']
      .forEach(s => $(s).classList.toggle('hidden', s !== id));

    const get = async (path) => {
      const r = await fetch(API + path);
      if (!r.ok) throw new Error(path + ' -> ' + r.status);
      return r.json();
    };
    // tolerant fetch: missing weeks (future/bye) return {} instead of throwing
    const getSoft = async (path) => { try { return await get(path); } catch { return {}; } };

    const progress = (pct, msg, hint = '') => {
      $('lbar').style.width = pct + '%';
      $('lmsg').textContent = msg;
      $('lhint').textContent = hint;
    };

    /* ---------- players DB: 14MB, so trim + cache for the day ---------- */
    const DB_KEY = 'sleeper_players_v1';
    const idb = {
      open: () => new Promise((res, rej) => {
        const r = indexedDB.open('sleeper-waivers', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      }),
      get: async k => {
        try {
          const db = await idb.open();
          return await new Promise(res => {
            const q = db.transaction('kv').objectStore('kv').get(k);
            q.onsuccess = () => res(q.result); q.onerror = () => res(null);
          });
        } catch { return null; }
      },
      set: async (k, v) => {
        try {
          const db = await idb.open();
          db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
        } catch { }
      }
    };

    async function loadPlayers() {
      const today = new Date().toISOString().slice(0, 10);
      const hit = await idb.get(DB_KEY);
      if (hit && hit.day === today) return hit.data;

      progress(12, 'Downloading player database…', 'About 14 MB — cached for the rest of the day.');
      const raw = await get('/players/nfl');
      const trim = {};
      for (const [id, p] of Object.entries(raw)) {
        if (!p.position) continue;
        trim[id] = {
          n: p.full_name || p.last_name || id, p: p.position,
          t: p.team, i: p.injury_status, s: p.status
        };
      }
      await idb.set(DB_KEY, { day: today, data: trim });
      return trim;
    }

    /* ---------- scoring ---------- */
    const scoreLine = (line, settings) => {
      let t = 0;
      for (const k in line) {
        const v = line[k];
        if (typeof v === 'number' && settings[k] != null) t += settings[k] * v;
      }
      return t;
    };
    const r1 = n => Math.round(n * 10) / 10;
    // projections: skip zeros, which are bye weeks
    const avgPos = arr => {
      const g = arr.filter(v => v > 0);
      return g.length ? g.reduce((a, b) => a + b, 0) / g.length : 0;
    };
    // actuals: average over weeks the player was ON THE FIELD. A 0 while playing is a
    // real bust game and must count; only genuine DNPs are excluded. Dropping zeros
    // here would let one big week in an otherwise empty season set a player's value.
    const avgPlayed = (vals, played) => {
      const g = vals.filter((_, i) => played[i]);
      return g.length ? g.reduce((a, b) => a + b, 0) / g.length : 0;
    };

    /* ---------- STEP 1 ---------- */
    let USER = null;
    async function findLeagues() {
      const name = $('uname').value.trim();
      if (!name) return;
      $('uerr').classList.add('hidden');
      $('go').disabled = true;
      try {
        const u = await get('/user/' + encodeURIComponent(name));
        if (!u || !u.user_id) throw new Error('not found');
        USER = u;
        const st = await get('/state/nfl');
        let lgs = await get(`/user/${u.user_id}/leagues/nfl/${st.season}`);
        if (!lgs.length) lgs = await get(`/user/${u.user_id}/leagues/nfl/${st.season - 1}`);
        if (!lgs.length) throw new Error('no leagues');
        $('uwelcome').textContent = u.display_name;
        $('lgs').innerHTML = '';
        lgs.forEach(l => {
          const b = document.createElement('button');
          b.className = 'card league';
          b.innerHTML = `<div><div class="nm">${esc(l.name)}</div>
        <div class="meta">${l.total_rosters} teams · ${l.season} · ${fmtScoring(l)}</div></div>
        <span class="badge">${esc(l.status.replace(/_/g, ' '))}</span>`;
          b.onclick = () => buildReport(l, st);
          $('lgs').appendChild(b);
        });
        show('s-league');
      } catch (e) {
        $('uerr').textContent = /not found|no leagues/.test(e.message)
          ? `No ${new Date().getFullYear()} NFL leagues found for "${name}". Check the spelling.`
          : 'Could not reach Sleeper: ' + e.message;
        $('uerr').classList.remove('hidden');
      } finally { $('go').disabled = false; }
    }
    const fmtScoring = l => {
      const r = l.scoring_settings?.rec ?? 0;
      return r >= 1 ? 'Full PPR' : r > 0 ? 'Half PPR' : 'Standard';
    };
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    /* ---------- STEP 3: the analysis ---------- */
    async function buildReport(league, state) {
      show('s-load');
      try {
        const week = state.week || 1;
        const SC = league.scoring_settings;

        progress(6, 'Loading league…');
        const [rosters, users, players] = await Promise.all([
          get(`/league/${league.league_id}/rosters`),
          get(`/league/${league.league_id}/users`),
          loadPlayers()
        ]);

        const me = rosters.find(r => r.owner_id === USER.user_id);
        if (!me) throw new Error('You have no roster in this league.');
        const nameOf = Object.fromEntries(users.map(u => [u.user_id, u.display_name]));

        // past weeks (actuals) + next 5 weeks (projections)
        const past = []; for (let w = 1; w < week; w++) past.push(w);
        const future = []; for (let w = week; w < week + 5; w++) future.push(w);

        progress(45, 'Loading stats and projections…', `Weeks 1–${week + 4}`);
        const [statsArr, projArr, matchArr, trendArr] = await Promise.all([
          Promise.all(past.map(w => getSoft(`/stats/nfl/regular/${league.season}/${w}`))),
          Promise.all(future.map(w => getSoft(`/projections/nfl/regular/${league.season}/${w}`))),
          Promise.all(past.map(w => getSoft(`/league/${league.league_id}/matchups/${w}`))),
          getSoft('/players/nfl/trending/add?lookback_hours=48&limit=200')
        ]);
        const stats = Object.fromEntries(past.map((w, i) => [w, statsArr[i]]));
        const proj = Object.fromEntries(future.map((w, i) => [w, projArr[i]]));
        const trend = {};
        if (Array.isArray(trendArr)) trendArr.forEach(t => trend[t.player_id] = t.count);

        progress(80, 'Crunching numbers…');

        const rostered = new Set();
        rosters.forEach(r => (r.players || []).forEach(p => rostered.add(p)));

        // Which positions each lineup slot accepts.
        const SLOT_OK = {
          QB: p => p === 'QB', RB: p => p === 'RB', WR: p => p === 'WR',
          TE: p => p === 'TE', DEF: p => p === 'DEF', K: p => p === 'K',
          FLEX: p => ['RB', 'WR', 'TE'].includes(p),
          REC_FLEX: p => ['WR', 'TE'].includes(p),
          SUPER_FLEX: p => ['QB', 'RB', 'WR', 'TE'].includes(p)
        };
        // Best legal starting lineup from a pool. Dedicated slots fill before flex
        // ones, so a flex never takes a player that a fixed slot still needs.
        const bestLineup = (pool, slots) => {
          const used = new Set();
          let total = 0;
          const order = [...slots].sort(
            (a, b) => (/FLEX/.test(a) ? 1 : 0) - (/FLEX/.test(b) ? 1 : 0));
          for (const slot of order) {
            const ok = SLOT_OK[slot];
            if (!ok) continue;
            let best = null;
            pool.forEach((p, i) => {
              if (used.has(i) || !ok(p.pos)) return;
              if (!best || p.v > best.v) best = { i, v: p.v };
            });
            if (best) { used.add(best.i); total += best.v; }
          }
          return total;
        };
        
        // Who competes with whom for touches: receivers share targets, backs share carries.
        const GROUP = { WR: 'REC', TE: 'REC', RB: 'RUSH' };
        const usage = (w, id) => {
          const st = stats[w]?.[id]; if (!st) return 0;
          return (st.rec_tgt || 0) + (st.rush_att || 0);
        };
        // Was this player's best week propped up by a teammate who was out and is
        // coming back? Returns that teammate, or null.
        const vacancy = (pid, p, act, played) => {
          const grp = GROUP[p.p]; if (!grp) return null;
          // the week he did his damage
          let bw = -1, bv = 0;
          act.forEach((v, i) => { if (played[i] && v > bv) { bv = v; bw = i; } });
          if (bw < 0 || bv < 10) return null;
          const week = past[bw];
          // did his own usage actually spike that week, or is he just consistently good?
          const mine = usage(week, pid);
          const other = past.filter((_, i) => i !== bw && played[i])
            .map(w => usage(w, pid));
          const base = other.length ? Math.max(...other) : 0;
          if (!(mine >= base * 1.8 && mine - base >= 3)) return null;   // no real spike
          // find a same-group teammate who sat that week, had usage otherwise,
          // and is not on IR -- i.e. the competition is coming back
          for (const [id, q] of Object.entries(players)) {
            if (id === pid || q.t !== p.t || GROUP[q.p] !== grp) continue;
            if (/IR|Suspend/i.test(q.i || '')) continue;               // not returning soon
            if (stats[week]?.[id]?.off_snp) continue;                  // he played, no vacancy
            const elsewhere = past.filter(w => w !== week).map(w => usage(w, id));
            if (elsewhere.some(u => u >= 4)) return { name: q.n, week };
          }
          return null;
        };

        // per-player view
        const view = pid => {
          const p = players[pid] || {};
          const act = past.map(w => scoreLine(stats[w]?.[pid] || {}, SC));
          const pr = future.map(w => scoreLine(proj[w]?.[pid] || {}, SC));
          const played = past.map(w => !!(stats[w]?.[pid]?.off_snp));
          // snap share + opportunity from the most recent completed week
          const last = stats[past[past.length - 1]]?.[pid] || {};
          const snap = last.tm_off_snp ? Math.round(last.off_snp / last.tm_off_snp * 100) : null;
          const opp = (last.rec_tgt || 0) + (last.rush_att || 0);
          const ros = avgPos(pr), actAvg = avgPlayed(act, played);
          // Sleeper projections lag breakout rookies badly, so blend in what a player
          // has actually done -- but only when a real snap share says the role is theirs,
          // otherwise we'd be chasing one-week touchdown luck.
          // Snap share says a player was on the field; it does NOT say who he was
          // competing with for the ball. A receiver can hold 90% of snaps all year and
          // only see volume in the one week the team's target hog sat out. Find that.
          const vac = vacancy(pid, p, act, played);
          const credit = snap != null && snap >= 60 ? (vac ? 0.15 : 0.35) : 0;
          const earned = ros * (1 - credit) + actAvg * credit;
          const hurt = /Out|IR|Doubtful|Suspend/i.test(p.i || '') ? 0.5
            : /Questionable/i.test(p.i || '') ? 0.9 : 1;
          return {
            pid, name: p.n, pos: p.p, team: p.t, inj: p.i,
            act, pr, ros, actAvg, score: earned * hurt, snap, opp, vac,
            adds: trend[pid] || 0
          };
        };

        const SKILL = ['QB', 'RB', 'WR', 'TE', 'DEF'];
        const freeAgents = Object.keys(players)
          .filter(id => !rostered.has(id))
          .filter(id => SKILL.includes(players[id].p))
          .filter(id => players[id].t)
          .filter(id => !players[id].s || players[id].s === 'Active')
          .map(view)
          .filter(v => v.ros > 0 || v.actAvg > 0)
          .sort((a, b) => b.score - a.score);

        const myTeam = (me.players || []).map(view)
          .sort((a, b) => b.score - a.score);

        // an add is only worth it if it beats someone you'd have to drop
        const droppable = myTeam.filter(p => !(me.starters || []).includes(p.pid))
          .sort((a, b) => a.score - b.score);
        const bar = droppable.length ? droppable[0].score : 0;

        // lineup leaks: optimal vs actual for each completed week
        const slots = league.roster_positions.filter(s => s !== 'BN');
        const leaks = past.map((w, i) => {
          const M = matchArr[i];
          if (!Array.isArray(M)) return null;
          const mine = M.find(m => m.roster_id === me.roster_id);
          if (!mine || !mine.players_points) return null;
          const opp = M.find(m => m.matchup_id === mine.matchup_id && m.roster_id !== me.roster_id);
          const pts = mine.players_points;
          const pool = Object.keys(pts).map(id =>
            ({ id, pos: players[id]?.p, name: players[id]?.n || id, v: pts[id] }));
          const used = new Set(); let best = 0;
          const take = ok => {
            const c = pool.filter(p => !used.has(p.id) && ok(p.pos))
              .sort((a, b) => b.v - a.v)[0];
            if (c) { used.add(c.id); best += c.v; return c; }
          };
          slots.filter(s => s !== 'FLEX' && s !== 'SUPER_FLEX' && s !== 'REC_FLEX')
            .forEach(s => take(p => p === s));
          slots.filter(s => s === 'FLEX').forEach(() =>
            take(p => ['RB', 'WR', 'TE'].includes(p)));
          slots.filter(s => s === 'SUPER_FLEX').forEach(() =>
            take(p => ['QB', 'RB', 'WR', 'TE'].includes(p)));
          const started = new Set(mine.starters || []);
          const missed = pool.filter(p => !started.has(p.id))
            .sort((a, b) => b.v - a.v).slice(0, 3);
          return {
            w, actual: mine.points || 0, best, opp: opp?.points ?? null,
            oppName: opp ? nameOf[rosters.find(r => r.roster_id === opp.roster_id)?.owner_id] : null,
            missed
          };
        }).filter(Boolean);

        TRADE = { me, rosters, nameOf, view,
                  slots: league.roster_positions.filter(p => p !== 'BN'), bestLineup };
        render(league, state, me, myTeam, droppable, freeAgents, leaks, bar, rosters, nameOf);
        progress(100, 'Done');
        show('s-report');
      } catch (e) {
        show('s-report');
        $('rtitle').textContent = 'Something went wrong';
        $('rmeta').textContent = e.message;
        $('rbody').innerHTML = '';
      }
    }

    /* ---------- rendering ---------- */
    const giveSet = new Set(), getSet = new Set();

function wireTrade() {
  const teamSel = $('t-team');
  if (!teamSel || !TRADE) return;
  const { me, rosters, view, slots, bestLineup } = TRADE;

  const paintGet = () => {
    const r = rosters.find(x => x.roster_id === +teamSel.value);
    const list = (r.players || []).map(view).sort((a, b) => b.score - a.score);
    $('t-get').innerHTML = list.map(p =>
      `<button class="pick${getSet.has(p.pid) ? ' on' : ''}" type="button" data-pid="${p.pid}">` +
      `${posCell(p)} ${nameCell(p)}<span class="num dim">${r1(p.score)}</span></button>`).join('');
  };

  const evaluate = () => {
    const give = [...giveSet], get = [...getSet];
    if (!give.length && !get.length) {
      $('t-result').innerHTML =
        '<p class="hint">Pick at least one player to see how the deal grades.</p>';
      return;
    }
    const held = (me.players || []).filter(p => !giveSet.has(p));
    const pool = ids => ids.map(view).map(p => ({ pos: p.pos, v: p.score }));
    const before = bestLineup(pool(me.players || []), slots);
    const after = bestLineup(pool([...held, ...get]), slots);
    const delta = after - before;
    // the lineup number ignores anyone who is not starting, so track raw swing too
    const depth = get.map(view).reduce((a, p) => a + p.score, 0)
                - give.map(view).reduce((a, p) => a + p.score, 0);
    const thin = Math.abs(delta) < 1 && depth < -2;
    const v = thin ? ['warn', 'Starters unchanged, but you lose depth']
      : delta >= 3 ? ['good', 'Accept — clear lineup gain']
      : delta >= 1 ? ['good', 'Slight gain']
      : delta > -1 ? ['dim', 'Roughly even']
      : delta > -3 ? ['warn', 'Slight loss']
      : ['bad', 'Decline — costs you starting points'];
    // Tiles rather than a table: five columns cannot fit a phone, and a
    // one-row table only ever scrolled or overflowed. These reflow instead.
    const tile = (k, val, cls = '') =>
      `<div class="tstat"><span class="k">${k}</span>` +
      `<span class="v ${cls}">${val}</span></div>`;
    $('t-result').innerHTML =
      `<div class="tstats">` +
      tile('Lineup now', r1(before)) +
      tile('After', r1(after)) +
      tile('Lineup', `${delta >= 0 ? '+' : ''}${delta.toFixed(1)}`, v[0]) +
      tile('Depth', `${depth >= 0 ? '+' : ''}${depth.toFixed(1)}`, depth < -2 ? 'warn' : 'dim') +
      `</div>` +
      chartDelta([
        { k: 'Lineup', v: delta, note: 'change to your best starting lineup' },
        { k: 'Depth', v: depth, note: 'raw value swing, starters or not' }
      ]) +
      `<p class="tverdict ${v[0]}">${v[1]}</p>` +
      (thin ? `<div class="note"><b>Lineup</b> counts only players who crack your best
        starting lineup, so this reads flat — but you would be ${r1(-depth)} points of
        bench value thinner for injuries and byes.</div>` : '');
  };

  const toggle = (box, set) => box.addEventListener('click', e => {
    const b = e.target.closest('.pick');
    if (!b) return;
    const id = b.dataset.pid;
    set.has(id) ? set.delete(id) : set.add(id);
    b.classList.toggle('on', set.has(id));
    evaluate();
  });
  toggle($('t-give'), giveSet);
  toggle($('t-get'), getSet);
  // A trade is with one team. Without this, picks from a previously selected
  // team stay in getSet -- invisible in the list, but still counted in the grade.
  teamSel.addEventListener('change', () => { getSet.clear(); paintGet(); evaluate(); });
  paintGet();
  evaluate();
}

/* ---------- charts ----------
   Forms picked by the data's job (see the report for which):
   - weekly scored vs best possible -> dumbbell, one hue / two ordinal steps
   - roster value                   -> horizontal bars, emphasis (starter vs bench)
   - trade deltas                   -> diverging bars around a zero baseline
   Every chart sits beside the table that carries the same numbers, so the
   hover layer enhances and never gates. ------------------------------- */

// Tooltip text comes from API data, so it is written with textContent only.
let TIPEL = null;
function showTip(el, x, y) {
  if (!TIPEL) {
    TIPEL = document.createElement('div');
    TIPEL.className = 'tip';
    document.querySelector('.ff').appendChild(TIPEL);
  }
  TIPEL.textContent = '';
  const v = document.createElement('b');
  v.textContent = el.dataset.tipValue || '';
  const k = document.createElement('div');
  k.textContent = el.dataset.tip || '';
  TIPEL.append(k, v);
  if (el.dataset.tipExtra) {
    const e = document.createElement('div');
    e.textContent = el.dataset.tipExtra;
    TIPEL.appendChild(e);
  }
  TIPEL.style.display = 'block';
  const w = TIPEL.offsetWidth, h = TIPEL.offsetHeight;
  TIPEL.style.left = Math.max(6, Math.min(x + 14, innerWidth - w - 6)) + 'px';
  TIPEL.style.top = Math.max(6, y - h - 10) + 'px';
}
function hideTip() { if (TIPEL) TIPEL.style.display = 'none'; }

function wireTips(root) {
  if (!root) return;
  root.addEventListener('pointermove', e => {
    const m = e.target.closest('[data-tip]');
    m ? showTip(m, e.clientX, e.clientY) : hideTip();
  });
  root.addEventListener('pointerleave', hideTip);
  root.addEventListener('focusin', e => {
    const m = e.target.closest('[data-tip]');
    if (!m) return;
    const b = m.getBoundingClientRect();
    showTip(m, b.left + b.width / 2, b.top);
  });
  root.addEventListener('focusout', hideTip);
}

// Weekly: what you scored vs the best your roster could have scored.
function chartWeekly(leaks) {
  if (leaks.length < 1) return '';
  // Headroom so the right-hand dot never reaches the edge: its value label rides
  // just outside the mark, and a clipped label is worse than no label at all.
  const max = Math.max(...leaks.map(l => l.best)) * 1.3;
  const pct = v => (v / max * 100);
  const rows = leaks.map(l => {
    const a = pct(l.actual), b = pct(l.best);
    return `<div class="dbrow">
      <span class="bname">Week ${l.w}</span>
      <div class="dbtrack">
        <span class="dbline" style="left:${a}%;width:${Math.max(0, b - a)}%"></span>
        <span class="dbdot a" tabindex="0" style="left:${a}%"
          data-tip="Week ${l.w} — scored" data-tip-value="${r1(l.actual)}"></span>
        <span class="dbdot b" tabindex="0" style="left:${b}%"
          data-tip="Week ${l.w} — best possible" data-tip-value="${r1(l.best)}"
          data-tip-extra="${r1(l.best - l.actual)} left on the bench"></span>
        <span class="dblab" style="left:calc(${b}% + 10px)">${r1(l.best)}</span>
      </div>
    </div>`;
  }).join('');
  return `<div class="chart">
    <div class="legend">
      <span><i class="key" style="background:var(--c-mark)"></i>Scored</span>
      <span><i class="key" style="background:var(--c-mark-2)"></i>Best possible lineup</span>
    </div>
    ${rows}
    <div class="axis"><span>0</span><span>${r1(max)} pts</span></div>
  </div>`;
}

// "Christian McCaffrey" needs 137px, which no phone can spare beside a bar.
// Chart axes abbreviate; the tooltip and the table below keep the full name.
const shortName = n => {
  const parts = String(n || '').trim().split(/\s+/);
  return parts.length < 2 ? (n || '') : `${parts[0][0]}. ${parts.slice(1).join(' ')}`;
};

// Roster value, emphasis form: the question is whether your best are starting.
function chartRoster(players, starterSet) {
  const list = players.filter(p => p.score > 0);
  if (!list.length) return '';
  const max = Math.max(...list.map(p => p.score));
  // Label selectively: the best player, and the best one sitting on the bench --
  // that pair is the whole question. The table underneath carries every value.
  const topBench = list.filter(p => !starterSet.has(p.pid))[0];
  const rows = list.map(p => {
    const on = starterSet.has(p.pid);
    return `<div class="brow">
      <span class="bname">${esc(shortName(p.name))}</span>
      <div class="btrack">
        <div class="vbar${on ? ' on' : ''}" tabindex="0" style="width:${p.score / max * 100}%"
          data-tip="${esc(p.name)} — ${on ? 'starting' : 'bench'}"
          data-tip-value="${r1(p.score)}"
          data-tip-extra="proj ${r1(p.ros)} · actual ${r1(p.actAvg)}"></div>
      </div>
    </div>`;
  }).join('');
  // The two numbers worth calling out ride in a caption rather than as labels on
  // the marks: a tip label on a proportional bar has nowhere safe to sit at
  // narrow widths, and every value is in the table directly below.
  const callout = `<p class="callout">Best: <b>${esc(list[0].name)} ${r1(list[0].score)}</b>`
    + (topBench ? ` · best on your bench: <b>${esc(topBench.name)} ${r1(topBench.score)}</b>` : '')
    + `</p>`;
  return `<div class="chart plot">
    <div class="legend">
      <span><i class="key rect" style="background:var(--c-mark)"></i>Starting</span>
      <span><i class="key rect" style="background:var(--c-mute)"></i>Bench</span>
    </div>
    ${callout}
    ${rows}
  </div>`;
}

// Trade deltas: polarity around zero, so diverging.
function chartDelta(rows) {
  const max = Math.max(1, ...rows.map(r => Math.abs(r.v)));
  const body = rows.map(r => {
    const w = Math.abs(r.v) / max * 50;
    const pos = r.v >= 0;
    return `<div class="dvrow">
      <span class="bname">${esc(r.k)}</span>
      <div class="dvtrack">
        <span class="dvzero"></span>
        <div class="dvbar ${pos ? 'pos' : 'neg'}" tabindex="0"
          style="left:${pos ? 50 : 50 - w}%;width:${w}%"
          data-tip="${esc(r.k)}" data-tip-value="${r.v >= 0 ? '+' : ''}${r.v.toFixed(1)}"
          data-tip-extra="${esc(r.note)}"></div>
      </div>
      <span class="bval">${r.v >= 0 ? '+' : ''}${r.v.toFixed(1)}</span>
    </div>`;
  }).join('');
  return `<div class="chart">${body}</div>`;
}

const posCell = p => `<span class="pos ${p.pos}">${p.pos}</span>`;
    const injTag = p => p.inj ? ` <span class="tag ${/Out|IR|Doubtful/i.test(p.inj) ? 'bad' : 'warn'}">${esc(p.inj)}</span>` : '';
    const nameCell = p => `<span class="nm">${esc(p.name)}</span>
  <span class="dim"> ${esc(p.team || '')}</span>${injTag(p)}`;

    function table(head, rows) {
      return `<div class="scroll"><table><thead><tr>${head}</tr></thead>
    <tbody>${rows.join('')}</tbody></table></div>`;
    }

    function render(league, state, me, myTeam, droppable, fas, leaks, bar, rosters, nameOf) {
  const leakTotal = leaks.reduce((a, l) => a + (l.best - l.actual), 0);
      const s = me.settings;
      $('rtitle').textContent = league.name;
      $('rmeta').innerHTML = `Week ${state.week} · ${s.wins}-${s.losses}` +
        ` · ${s.fpts}.${s.fpts_decimal || 0} PF · ` +
        `${league.total_rosters} teams · ${fmtScoring(league)}`;

      const starterSet = new Set(me.starters || []);
      const waiverFaab = league.settings.waiver_type === 2;
      const leadKpis = `<div class="tstats">
    <div class="tstat"><span class="k">Record</span><span class="v">${s.wins}-${s.losses}</span></div>
    <div class="tstat"><span class="k">Points for</span><span class="v">${s.fpts}.${s.fpts_decimal || 0}</span></div>
    <div class="tstat"><span class="k">Left on bench</span><span class="v ${
      leakTotal > 15 ? 'bad' : leakTotal > 6 ? 'warn' : 'dim'}">${r1(leakTotal)}</span></div>
    <div class="tstat"><span class="k">Best available</span><span class="v">${r1(fas[0]?.score || 0)}</span></div>
  </div>`;

      const pills = `
    <span class="pill">Waivers: ${waiverFaab
          ? `FAAB · $${league.settings.waiver_budget - (s.waiver_budget_used || 0)} left`
          : `priority #${s.waiver_position} of ${league.total_rosters}`}</span>
    <span class="pill">Roster ${(me.players || []).length}/${league.roster_positions.length}</span>
    <span class="pill">Lineup: ${league.roster_positions.filter(p => p !== 'BN').join(' / ')}</span>`;

      /* --- trade evaluator ------------------------------------------------
         Sleeper's public API never exposes pending trades -- only completed
         transactions -- so an offer has to be entered by hand. Same engine
         either way: how far does the deal move your best starting lineup. */
      const others = rosters.filter(r => r.roster_id !== me.roster_id);
      const pickRow = p =>
        `<button class="pick" type="button" data-pid="${p.pid}">` +
        `${posCell(p)} ${nameCell(p)}<span class="num dim">${r1(p.score)}</span></button>`;
      const tradeSection = !others.length ? '' : `
        <h2>Trade evaluator<span class="sub">tap players on each side to grade an offer</span></h2>
        <div class="card">
          <div class="tradecols">
            <div>
              <label>You give</label>
              <div class="picklist" id="t-give">${
                myTeam.map(pickRow).join('')}</div>
            </div>
            <div>
              <label for="t-team">You get from</label>
              <select id="t-team">${others.map(r =>
                `<option value="${r.roster_id}">${esc(nameOf[r.owner_id] || 'Roster ' + r.roster_id)}</option>`
              ).join('')}</select>
              <div class="picklist" id="t-get"></div>
            </div>
          </div>
          <div id="t-result"></div>
        </div>`;

      const byPos = {};
      fas.forEach(f => { (byPos[f.pos] ||= []).push(f); });

      /* --- the headline: positional upgrades only --------------------------
         Ranking free agents globally floods this with QBs, because a startable
         QB always out-projects a WR3. The real question is per position: does
         the best available P beat the worst P you already roster? --------- */
      const FLEXABLE = ['RB', 'WR', 'TE'];
      const mineByPos = {};
      myTeam.forEach(p => { (mineByPos[p.pos] ||= []).push(p); });
      Object.values(mineByPos).forEach(a => a.sort((x, y) => y.ros - x.ros));

      const healthy = f => !/Out|IR|Doubtful|Suspend/i.test(f.inj || '');
      const spent = new Set();   // a player can only be dropped once
      const upgrades = ['RB', 'WR', 'TE', 'QB', 'DEF'].map(pos => {
        const fa = (byPos[pos] || []).filter(healthy)[0];
        if (!fa) return null;
        const mine = mineByPos[pos] || [];
        // the roster spot this player would actually take: your worst at the position
        const benchmark = mine.length ? mine[mine.length - 1] : null;
        const gain = fa.score - (benchmark ? benchmark.score : 0);
        return { fa, benchmark, gain };
      }).filter(u => u && u.gain > 0.5)
        .sort((a, b) => b.gain - a.gain)
        .map(u => {
          // prefer cutting the guy he replaces, but never a starter, never twice
          const pick = (u.benchmark && !starterSet.has(u.benchmark.pid) && !spent.has(u.benchmark.pid))
            ? u.benchmark
            : droppable.find(d => !spent.has(d.pid));
          if (!pick) return null;
          spent.add(pick.pid);
          // gain stays the same-position comparison -- a QB's score is not
          // comparable to an RB's, so the cut player only frees the roster spot
          return { ...u, drop: pick, swap: pick.pid === u.benchmark?.pid };
        }).filter(Boolean);

      const topSection = upgrades.length ? `
    <h2>Recommended moves<span class="sub">upgrade is measured against your weakest player at that same position</span></h2>` +
        table(`<th>Add</th><th class="num">Value</th><th></th><th>Drop</th><th class="num">Value</th><th class="num">Upgrade</th><th></th>`,
          upgrades.map(u => `<tr>
          <td>${posCell(u.fa)} ${nameCell(u.fa)}</td>
          <td class="num good">${r1(u.fa.score)}</td>
          <td class="dim">for</td>
          <td>${posCell(u.drop)} ${nameCell(u.drop)}</td>
          <td class="num">${r1(u.drop.score)}</td>
          <td class="num good">+${r1(u.gain)}</td>
          <td class="dim">${u.fa.vac
              ? `<span class="warn">Volume came in wk ${u.fa.vac.week} with ${esc(u.fa.vac.name)} out — role may close</span>`
              : (u.gain >= 3 ? 'Clear upgrade'
                : u.gain >= 1.5 ? 'Worth the move' : 'Marginal')
              + (u.swap ? '' : ` at ${u.fa.pos} — drop just frees the spot`)}</td></tr>`))
        : `<h2>Recommended moves</h2><div class="note">Nothing on the wire beats what you
       already roster at any position. <b>Hold.</b></div>`;

      /* --- lineup leaks --- */
      const totalLeak = leakTotal;
      const leakSection = leaks.length ? `
    <h2>Lineup leaks<span class="sub">points left on your bench</span></h2>` +
        chartWeekly(leaks) +
        table(`<th>Week</th><th>Result</th><th class="num">Scored</th><th class="num">Optimal</th>
           <th class="num">Left on bench</th><th>Biggest miss</th>`,
          leaks.map(l => {
            const won = l.opp != null && l.actual > l.opp;
            const gap = l.best - l.actual;
            return `<tr>
          <td>Week ${l.w}</td>
          <td class="${won ? 'good' : 'bad'}">${l.opp != null
                ? (won ? 'W' : 'L') + ` ${r1(l.actual)}–${r1(l.opp)}` : '—'}
            <span class="dim">${l.oppName ? 'vs ' + esc(l.oppName) : ''}</span></td>
          <td class="num">${r1(l.actual)}</td>
          <td class="num">${r1(l.best)}</td>
          <td class="num ${gap > 10 ? 'bad' : gap > 4 ? 'warn' : 'dim'}">${gap > 0.05 ? '-' + r1(gap) : '0'}</td>
          <td class="sparks">${l.missed.map(m => `${esc(m.name)} ${r1(m.v)}`).join(' · ')}</td></tr>`;
          })) +
        (totalLeak > 8 ? `<div class="note"><b>${r1(totalLeak)} points</b> left on your bench
       so far — ${r1(totalLeak / leaks.length)}/week. No waiver add fixes a start/sit problem.</div>` : '')
        : '';

      /* --- your roster --- */
      const rosterSection = `<h2>Your roster<span class="sub">value by player — are your best players starting?</span></h2>` +
        chartRoster(myTeam, starterSet) +
        table(`<th>Player</th><th class="num">Value</th><th class="num">Proj/wk</th><th class="num">Actual/wk</th>
           <th class="num">Snap%</th><th>Status</th>`,
          myTeam.map(p => `<tr>
        <td>${posCell(p)} ${nameCell(p)}</td>
        <td class="num">${r1(p.score) || '—'}</td>
        <td class="num dim">${r1(p.ros) || '—'}</td>
        <td class="num">${r1(p.actAvg) || '—'}</td>
        <td class="num">${p.snap != null ? p.snap + '%' : '—'}</td>
        <td class="dim">${starterSet.has(p.pid) ? 'Starter'
              : (me.reserve || []).includes(p.pid) ? 'IR' : 'Bench'}</td></tr>`));

      /* --- drop candidates --- */
      const dropSection = droppable.length ? `
    <h2>Drop candidates<span class="sub">weakest bench spots, worst first</span></h2>` +
        table(`<th>Player</th><th class="num">Value</th><th class="num">Proj/wk</th><th class="num">Actual/wk</th><th></th>`,
          droppable.slice(0, 5).map(p => `<tr>
        <td>${posCell(p)} ${nameCell(p)}</td>
        <td class="num">${r1(p.score) || '—'}</td>
        <td class="num dim">${r1(p.ros) || '—'}</td>
        <td class="num">${r1(p.actAvg) || '—'}</td>
        <td class="dim">${/Out|IR/i.test(p.inj || '') ? 'IR-eligible — stash, do not cut' : ''}</td>
      </tr>`)) : '';

      $('rbody').innerHTML = leadKpis + pills + topSection + tradeSection + leakSection +
        dropSection + rosterSection +
        `<div class="note note--plain">
      <b>Value</b> blends Sleeper's projection with what a player has actually produced,
      crediting production only above a 60% snap share (below that it's usually touchdown
      luck), discounting injuries, and heavily discounting volume that arrived only while a
      teammate was out. Weeks a player suited up and busted count against him; only true
      DNPs are skipped. Sleeper's raw projections lag breakout rookies, which
      is why <b>Proj/wk</b> is shown next to it.</div>`;

      wireTrade();
      wireTips($('rbody'));
    }


    /* ---------- wiring ---------- */
    $('go').onclick = findLeagues;
    $('uname').onkeydown = e => { if (e.key === 'Enter') findLeagues(); };
    $('back1').onclick = () => show('s-user');
    $('back2').onclick = () => show('s-league');
    show('s-user');
    $('uname').focus();
  </script>
</body>

</html>
