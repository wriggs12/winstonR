  <style>
    .mu,
    .mu *,
    .mu *::before,
    .mu *::after {
      box-sizing: border-box;
    }

    .mu {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    .mu h1 {
      font-size: 26px;
      margin: 0 0 6px;
      color: var(--text-1);
    }

    .mu h2 {
      font-size: 17px;
      margin: 32px 0 12px;
      color: var(--brand);
    }

    .mu h2 .sub {
      font-weight: 400;
      color: var(--text-2);
      font-size: 13px;
      margin-left: 8px;
    }

    .mu .lede {
      color: var(--text-2);
      margin: 0 0 24px;
      font-size: 14px;
    }

    .mu .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }

    /* album grid */
    .mu .songs {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .mu .song {
      display: block;
      text-decoration: none;
      color: inherit;
      border-radius: 10px;
      outline: none;
    }

    .mu .cover {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface-2);
      border: 1px solid var(--border);
      transition: border-color .15s, transform .15s, box-shadow .15s;
    }

    .mu .cover img {
      position: relative;
      /* paint above the placeholder note */
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .3s;
    }

    .mu .cover img.loaded {
      opacity: 1;
    }

    /* placeholder note shown until (or instead of) the artwork */
    .mu .cover .ph {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 34px;
      color: var(--border);
    }

    .mu .cover .play {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(15, 20, 25, 0.8);
      color: var(--brand);
      font-size: 16px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .15s, transform .15s;
    }

    .mu .song:hover .cover,
    .mu .song:focus-visible .cover {
      border-color: var(--brand);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .mu .song:hover .play,
    .mu .song:focus-visible .play {
      opacity: 1;
      transform: none;
    }

    .mu .song .title {
      display: block;
      margin-top: 8px;
      font-weight: 700;
      font-size: 14px;
      color: var(--text-1);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mu .song .artist {
      display: block;
      font-size: 12.5px;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* featured "on repeat" card; its backdrop is a blurred copy of the cover */
    .mu .hero {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      text-decoration: none;
      color: inherit;
    }

    .mu .hero[hidden] {
      display: none;
    }

    .mu .hero .backdrop {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(48px) saturate(1.4);
      transform: scale(1.4);
      opacity: 0;
      transition: opacity .6s;
    }

    /* darken so the text always reads, whatever the cover's colors */
    .mu .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, rgba(15, 20, 25, 0.35), rgba(15, 20, 25, 0.75));
    }

    .mu .hero .backdrop.loaded {
      opacity: .7;
    }

    .mu .hero .cover {
      width: 200px;
      flex-shrink: 0;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .mu .hero .info {
      min-width: 0;
    }

    .mu .hero .label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .mu .hero .h-title {
      display: block;
      margin: 8px 0 2px;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-1);
    }

    .mu .hero .h-artist {
      display: block;
      font-size: 15px;
      color: var(--text-2);
    }

    .mu .hero .h-note {
      margin: 14px 0 0;
      font-size: 14px;
      color: var(--text-1);
      opacity: .85;
    }

    .mu .hero .listen {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      padding: 9px 16px;
      border-radius: 99px;
      background: var(--text-1);
      color: var(--bg);
      font-size: 13.5px;
      font-weight: 700;
      transition: background .15s;
    }

    .mu .hero:hover .listen,
    .mu .hero:focus-visible .listen {
      background: var(--brand);
    }

    .mu .hero:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    /* page glow tinted by the cover in focus; sits under the particles */
    @property --amb {
      syntax: '<color>';
      inherits: false;
      initial-value: #219ebc;
    }

    #ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 85% 55% at 50% -5%, color-mix(in srgb, var(--amb) 30%, transparent), transparent 70%),
        radial-gradient(ellipse 60% 45% at 100% 100%, color-mix(in srgb, var(--amb) 12%, transparent), transparent 70%);
      transition: --amb .8s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      #ambient {
        transition: none;
      }
    }

    @media (max-width: 576px) {
      .mu {
        padding: 20px 12px 64px;
      }

      .mu h1 {
        font-size: 22px;
      }

      .mu .hero {
        flex-direction: column;
        align-items: flex-start;
        gap: 18px;
        padding: 18px;
      }

      .mu .hero .cover {
        width: 100%;
        max-width: 260px;
      }

      .mu .hero .h-title {
        font-size: 22px;
      }

      .mu .songs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
    }
  </style>
</head>

      { title: 'HIGHJACK (right back)', artist: 'Alok, Łaszewo & A$AP Rocky', url: 'https://www.youtube.com/watch?v=UkrvYca8s-I', cover: 'https://yt3.googleusercontent.com/FIlOGr5ejO4YYmXYQipuz84HI6q8_jhuvgkAePVFUJpJw4eI2776lB9LO8IYn4aBX59hF-clzhjDMTID=w600-h600-l90-rj' },
      { title: 'Silence (Airscape Remix)', artist: 'Delerium', url: 'https://www.youtube.com/watch?v=oTLJjoW867g&list=RDoTLJjoW867g&start_radio=1', cover: 'https://yt3.googleusercontent.com/HagF7RQEV-NET0fSn9sDlzwP4tvcjI3K_iUkO-4s9zAvZe3nqDkqoaPBXAohriyQZfloz6LNP36E1K-_=w600-h600-l90-rj' },
      { title: 'Believe', artist: 'Cher', url: 'https://www.youtube.com/watch?v=oOGxKLUMbbc', cover: 'https://yt3.googleusercontent.com/edGjMf2CcnPfFlC78wkFcIzBdW7EXNjGF60IHilJo3mOy3UFrjKO3U-hMWLfxSrjimWTz7T-uPnLL6YHDw=w600-h600-s-l90-rj' },
      { title: 'Infinite', artist: 'Eminem', url: 'https://www.youtube.com/watch?v=Awuj-9oXms4', cover: 'https://yt3.googleusercontent.com/Z4bnlgDE6prxIkMZzM_bq5mmN9GeA-EY5aAkfjjSIWBpJHTW-fx7Ax7d9kpxlO0kuaJr3ndEHxXNv2UY3A=w600-h600-l90-rj' },
      { title: '2009', artist: 'Mac Miller', url: 'https://www.youtube.com/watch?v=5zivz7kVKNo', cover: 'https://yt3.googleusercontent.com/YxyJh9VYIKgPAulnGiK6OMmBm2r_3eSTsm1myZu1qSKXlb77sSKlGl8VOgxU0tS1LJreNMntkktrp2Y=w600-h600-l90-rj' },
      { title: 'Purple Rain', artist: 'Prince', url: 'https://www.youtube.com/watch?v=347vCib_lMs', cover: 'https://yt3.googleusercontent.com/vJbte0qGG-GmLK6lms4lwFHND7YAQGPT0s6ANe4lLaYjm9UizD8RdisHf6vqrqvRHQoQ8suQ9N5cGKPK=w600-h600-l90-rj' },

      { title: 'adore u', artist: 'Fred again..', url: 'https://www.youtube.com/watch?v=zUxJP8IiN5g', cover: 'https://yt3.googleusercontent.com/7weTWbK_H4ff5ULsPlITgrnfHTrRh-zGHyLuXFZEIi4qnEO1FY9-X9UjnoRTuyRza9UBfCk7axB8cRJ-=w600-h600-l90-rj' },
      { title: 'I\'m On Fire', artist: 'Bruce Springsteen', url: 'https://www.youtube.com/watch?v=1VxFS5-klfk', cover: 'https://yt3.googleusercontent.com/fJUAt8fNSPSXLzFFll7dA-0usJM-4I1N6-x6N1w5M-SNsEcvwM0Wp81bc838ahL6L6DRULeNzB6ioNqg=w600-h600-l90-rj' },
      { title: 'Self Care', artist: 'Mac Miller', url: 'https://www.youtube.com/watch?v=rn4mVQswfNg', cover: 'https://yt3.googleusercontent.com/YxyJh9VYIKgPAulnGiK6OMmBm2r_3eSTsm1myZu1qSKXlb77sSKlGl8VOgxU0tS1LJreNMntkktrp2Y=w600-h600-l90-rj' },
      { title: 'Fashion Killa', artist: 'A$AP Rocky', url: 'https://www.youtube.com/watch?v=J_Hf6ssMTyM', cover: 'https://yt3.googleusercontent.com/Oa7LlzALtpit3vY3QTq6mSpPeIJOIHCARLmXjzOMKdJHRfw3VGg2TXhoWbSDc-gic9hOeNe-1DzVKHg=w600-h600-l90-rj' },
      { title: 'Dani California', artist: 'Red Hot Chili Peppers', url: 'https://www.youtube.com/watch?v=4FkfyssnHqU', cover: 'https://yt3.googleusercontent.com/aUs9JPxr2nWmA6_8bL1YIjI6xHM7TfwZifuA_R76Y9WinfOSval3RCb8x1lkEtq1G-5gwrHYSaQkAUkz=w600-h600-s-l90-rj' },
      { title: 'Neon', artist: 'John Mayer', url: 'https://www.youtube.com/watch?v=eXBNx9JL-_w', cover: 'https://yt3.googleusercontent.com/y_RTFtwTAk98KQrIEuWBiSzYw8b7vc23J8Hv6_WmkzgUomTuqvYIu99oo6F5nYo3dVFifu4-zQecli4=w600-h600-l90-rj' },
    ];

    const $ = id => document.getElementById(id);

    function iconFor(url) {
      const host = (() => { try { return new URL(url).hostname; } catch { return ''; } })();
      if (/youtube\.com|youtu\.be/.test(host)) return 'fa-youtube-play';
      if (/spotify\.com/.test(host)) return 'fa-spotify';
      if (/soundcloud\.com/.test(host)) return 'fa-soundcloud';
      if (/music\.apple\.com/.test(host)) return 'fa-apple';
      return 'fa-play';
    }

    // ── Album covers ────────────────────────────────────────────────
    // A song's `cover` wins if set; otherwise look it up on the iTunes
    // Search API (free, no key, CORS-enabled) and cache the result so
    // repeat visits don't hit the API again.
    const COVER_CACHE = 'music-covers-v1';
    const cache = (() => { try { return JSON.parse(localStorage.getItem(COVER_CACHE)) || {}; } catch { return {}; } })();
    const saveCache = () => { try { localStorage.setItem(COVER_CACHE, JSON.stringify(cache)); } catch { } };

    // JSONP instead of fetch: Apple refuses CORS for pages opened from disk
    // (origin "null"), but a <script> request works from anywhere.
    let jsonpId = 0;
    function itunesSearch(term) {
      return new Promise((resolve, reject) => {
        const cb = `__itunes${jsonpId++}`;
        const el = document.createElement('script');
        const done = () => { delete window[cb]; el.remove(); clearTimeout(timer); };
        const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 8000);
        window[cb] = data => { done(); resolve(data); };
        el.onerror = () => { done(); reject(new Error('network')); };
        el.src = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&entity=song&limit=1&callback=${cb}`;
        document.head.appendChild(el);
      });
    }

    const pending = new Map(); // the featured song is looked up twice at once
    function findCover(s) {
      if ('cover' in s) return Promise.resolve(s.cover || null); // '' = no cover
      const key = `${s.artist} — ${s.title}`;
      if (key in cache) return Promise.resolve(cache[key]);
      if (!pending.has(key)) {
        pending.set(key, itunesSearch(`${s.artist} ${s.title}`).then(data => {
          // artwork URLs end in "100x100bb.jpg"; any size can be requested
          cache[key] = data.results?.[0]?.artworkUrl100?.replace('100x100bb', '600x600bb') || null;
          saveCache();
          return cache[key];
        }, () => null) // network hiccup: don't cache, try again next visit
          .finally(() => pending.delete(key)));
      }
      return pending.get(key);
    }

    // ── Cover colors → page glow ────────────────────────────────────
    // Apple's artwork server allows CORS, so a cover can be sampled once
    // it loads. A custom `cover` from a host without CORS still shows; it
    // just doesn't tint the page.
    const ambient = $('ambient');
    const DEFAULT_GLOW = getComputedStyle(document.documentElement).getPropertyValue('--brand-deep').trim() || '#219ebc';
    let featuredGlow = DEFAULT_GLOW;
    const setGlow = color => ambient.style.setProperty('--amb', color || featuredGlow);

    function loadCover(img, src, onColor) {
      img.addEventListener('load', () => {
        img.classList.add('loaded');
        const color = img.crossOrigin ? dominantColor(img) : null;
        if (color && onColor) onColor(color);
      });
      img.addEventListener('error', () => {
        if (!img.crossOrigin) return;
        img.removeAttribute('crossorigin'); // retry as a plain, unsampled image
        img.src = src;
      }, { once: true });
      img.crossOrigin = 'anonymous';
      img.src = src;
    }

    // Average the cover's pixels, weighted toward saturated mid-tones so a
    // black border or white text doesn't wash out the color, then brighten.
    function dominantColor(img) {
      try {
        const N = 24;
        const c = document.createElement('canvas');
        c.width = c.height = N;
        const x = c.getContext('2d', { willReadFrequently: true });
        x.drawImage(img, 0, 0, N, N);
        const d = x.getImageData(0, 0, N, N).data;
        let r = 0, g = 0, b = 0, total = 0;
        for (let i = 0; i < d.length; i += 4) {
          const max = Math.max(d[i], d[i + 1], d[i + 2]), min = Math.min(d[i], d[i + 1], d[i + 2]);
          const sat = max ? (max - min) / max : 0;
          const mid = max > 40 && max < 245 ? 1 : 0.05;
          const w = sat * sat * mid + 0.002;
          r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; total += w;
        }
        r /= total; g /= total; b /= total;
        const k = 220 / Math.max(r, g, b, 1);
        return `rgb(${Math.round(r * k)}, ${Math.round(g * k)}, ${Math.round(b * k)})`;
      } catch {
        return null; // canvas was tainted: no CORS on this image
      }
    }

    function renderSongs() {
      const list = $('songs');
      list.replaceChildren(...SONGS.map(s => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'song';
        a.href = s.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = `<div class="cover">
            <span class="ph"><i class="fa fa-music" aria-hidden="true"></i></span>
            <img alt="" loading="lazy">
            <span class="play"><i class="fa ${iconFor(s.url)}" aria-hidden="true"></i></span>
          </div>
          <span class="title"></span><span class="artist"></span>`;
        a.querySelector('.title').textContent = s.title;
        a.querySelector('.artist').textContent = s.artist;
        a.title = `${s.title} — ${s.artist}`;

        const img = a.querySelector('img');
        findCover(s).then(src => { if (src) loadCover(img, src, c => { a.dataset.glow = c; }); });
        a.addEventListener('pointerenter', () => setGlow(a.dataset.glow));
        a.addEventListener('focus', () => setGlow(a.dataset.glow));

        li.appendChild(a);
        return li;
      }));
      // leaving the grid (pointer or keyboard) returns to the featured song's glow
      list.addEventListener('pointerleave', () => setGlow());
      list.addEventListener('focusout', e => { if (!list.contains(e.relatedTarget)) setGlow(); });
      $('count').textContent = `${SONGS.length} song${SONGS.length === 1 ? '' : 's'}`;
    }
    renderSongs();

    // ── Featured song ───────────────────────────────────────────────
    // The song marked `featured: true` (or the first one) gets the big card.
    function renderFeatured() {
      const s = SONGS.find(x => x.featured) || SONGS[0];
      if (!s) return;
      const a = $('hero');
      a.href = s.url;
      a.innerHTML = `<img class="backdrop" alt="">
        <div class="cover">
          <span class="ph"><i class="fa fa-music" aria-hidden="true"></i></span>
          <img alt="">
        </div>
        <div class="info">
          <span class="label"><i class="fa fa-repeat" aria-hidden="true"></i> On repeat</span>
          <span class="h-title"></span>
          <span class="h-artist"></span>
          <p class="h-note" hidden></p>
          <span class="listen"><i class="fa ${iconFor(s.url)}" aria-hidden="true"></i> Listen</span>
        </div>`;
      a.querySelector('.h-title').textContent = s.title;
      a.querySelector('.h-artist').textContent = s.artist;
      if (s.note) {
        const note = a.querySelector('.h-note');
        note.textContent = s.note;
        note.hidden = false;
      }
      findCover(s).then(src => {
        if (!src) return;
        loadCover(a.querySelector('.backdrop'), src);
        loadCover(a.querySelector('.cover img'), src, c => { featuredGlow = c; setGlow(); });
      });
      a.hidden = false;
    }
    renderFeatured();
  </script>
